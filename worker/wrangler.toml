name = "osint-rag"
main = "rag-worker.js"
compatibility_date = "2026-10-01"
# Secret (never in this file): wrangler secret put FACTCHECK_API_KEY
# Secrets (never in this file):
#   wrangler secret put FACTCHECK_API_KEY     # Google Fact Check Tools API (optional; published verdicts)
#   wrangler secret put GEMINI_API_KEY        # Google AI Studio key - enables all Gemini features
#   wrangler secret put EXA_API_KEY           # Exa web search (optional; separate paid account, only if chosen)
# Plain vars to set here (not secrets):
#   GEMINI_MODEL = "gemini-3.8-flash"         # stable text model per ai.google.dev/gemini-api/docs/models (2026-10-25)
#   GEMINI_EMBED_MODEL = "gemini-embedding-2" # per ai.google.dev/gemini-api/docs/embeddings (2026-10-25)
# Without GEMINI_API_KEY + GEMINI_MODEL the assistant runs retrieval-only and says so on the page.
