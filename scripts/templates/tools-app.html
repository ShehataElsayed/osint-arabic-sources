p.innerHTML=`<button class="bk" id="bk">← كل الأدوات</button>${demo?'<p class="warn">بيانات تجريبية مصطنعة لأغراض العرض فقط؛ لا تمثل وقائع أو جهات حقيقية.</p>':''}<h2 style="margin:0">${e(t.name_ar)} <small class="st">${e(t.name_en)}</small></h2><p class="s">${e(t.desc_ar)}</p>`+t.inputs.map(([k,l,kind])=>kind=='file'?`<label>${e(l)}<input type="file" ${k=='folder'?'multiple accept="image/*"':''} data-f="1"></label><p class="st">الملفات تُقرأ داخل المتصفح ولا تُرفع إلى أي خادم.</p>`:`<label>${e(l)}${kind=='textarea'?`<textarea rows="6" dir="${k=='csv'||k=='raw'?'ltr':'auto'}" name="${k}">${demo?e(SAMPLE[t.id+'.'+k]||SAMPLE[k]||''):''}</textarea>`:`<input type="text" name="${k}" value="${demo?e(SAMPLE[t.id+'.'+k]||SAMPLE[k]||''):''}">`}</label>`).join('')+`<button class="go" id="go">تشغيل</button>${t.ai?`<label style="margin-inline-start:14px;color:var(--muted)"><input type="checkbox" id="useai" style="width:auto;margin:0 6px" ${AI.length?'':'disabled'}>شرح بالذكاء الاصطناعي (${AI.length?'متصل':'غير متصل'})</label>`:''}<p class="st" id="st" role="status"></p><pre id="out" hidden></pre>`;
document.getElementById('bk').onclick=()=>{history.replaceState(null,'',location.pathname);location.reload()};
document.getElementById('go').onclick=async()=>{const b={};window.__F=[];p.querySelectorAll('[name]').forEach(i=>b[i.name]=i.value);p.querySelectorAll('input[data-f]').forEach(i=>window.__F.push(...i.files));if(t.ai)b.ai=document.getElementById('useai').checked;const st=document.getElementById('st'),o=document.getElementById('out');st.textContent='جارٍ التنفيذ…';o.hidden=true;
try{const r=await fetch('/api/run/'+id,{method:'POST',body:JSON.stringify(b)}).then(r=>r.json());st.textContent=r.ok?'تم التنفيذ.':'تعذر: '+(r.error||'');const rv=document.createElement('div');rv.className='rv';if(r._plan){const{_plan:P,...R}=r;rv.innerHTML=planView(P)+'<details><summary>تفاصيل النموذج والحقول (درجات، كلمات، خطوات محذوفة، ملاحظة)</summary>'+view(R)+'</details>'}else rv.innerHTML=view(r);st.after(rv);o.before(document.createElement('details'));const dt=o.previousSibling;dt.innerHTML='<summary>النتيجة الخام (JSON)</summary>';dt.appendChild(o);if(r.checklist){const c=document.createElement('div');c.className='warn';c.innerHTML='<b>قائمة التحقق (مراجعة بشرية):</b><ul>'+(r.checklist.length?r.checklist.map(x=>'<li>'+e(x)+'</li>').join(''):'<li>لا بنود</li>')+'</ul>';st.after(c)}o.hidden=false;o.textContent=JSON.stringify(r,null,2)}catch(x){st.textContent='انقطع الاتصال بالخادم المحلي.'}};
if(demo)document.getElementById('go').click()}
</script></html>
