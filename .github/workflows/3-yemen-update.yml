name: Update Yemen map feeds
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh headline index (GDELT)
        run: python3 scripts/fetch_yemen_news.py
      - name: Commit if changed
        run: |
          git config user.name "yemen-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data/yemen-news.json
          git diff --cached --quiet || (git commit -m "Update Yemen headline index" && git push)
