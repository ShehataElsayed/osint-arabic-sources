name: Validate local image workbench
on:
  pull_request:
    paths: ['site/**', 'scripts/**', 'tests/**', 'package*.json', '.github/workflows/local-tools.yml']
  push:
    branches: [work/catalog-local-execution]
permissions:
  contents: read
jobs:
  image-workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check:js
      - run: npx playwright install --with-deps chromium
      - run: CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())") npm run test:image-difference
      - run: CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())") npm run test:browser
      - run: TEST_SITE=_site CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())") npm run test:journalist

      - name: Domain evidence integrity regression
        run: TEST_SITE=_site CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())") node tests/domain-integrity.cjs

      - name: Standalone tools entry regression
        run: TEST_SITE=_site CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())") node tests/standalone-entry.cjs

      - name: Domain shared-case portability
        run: TEST_SITE=_site CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())") node tests/domain-case-portability.cjs

      - name: Source-linked claims case portability
        run: TEST_SITE=_site CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())") node tests/claims-case-portability.cjs

      - name: Versions shared-case portability
        run: TEST_SITE=_site CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())") node tests/versions-case-portability.cjs

      - name: Timeline shared-case portability
        run: TEST_SITE=_site CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())") node tests/timeline-case-portability.cjs

      - name: Entities shared-case portability
        run: TEST_SITE=_site CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())") node tests/entities-case-portability.cjs
