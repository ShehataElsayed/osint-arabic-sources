name: Deploy Arabic source directory
on:
  push:
    branches: [main]
    paths:
      - '2-1-osint-header-final.zip'
      - 'content/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build directory and articles
        run: |
          mkdir -p _site
          unzip -q 2-1-osint-header-final.zip -d _site
          python3 _site/build_content.py _site content
          test -f _site/index.html
          test -f _site/admin.html
          test -f _site/posts/index.html
          test -f _site/catalog/category-01.html
          test -f _site/lab.html
          test -f _site/statistics.html
          test -f _site/verification.html
          test -f _site/smart-search.html
          test -f _site/commands.html
          test -f _site/methodology.html
      - name: Rebuild local search index
        run: |
          npx --yes pagefind@1.5.2 --site _site --output-path _site/pagefind
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
