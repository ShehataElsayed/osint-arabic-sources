name: Deploy Arabic source directory
on:
  push:
    branches: [main]
    paths:
      - '2-5-osint-workbench.zip'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack static directory
        run: |
          mkdir -p _site
          unzip -q 2-5-osint-workbench.zip -d _site
          test -f _site/index.html
          test -f _site/pagefind/pagefind.js
          test -f _site/catalog/category-01.html
          test -f _site/lab.html
          test -f _site/statistics.html
          test -f _site/verification.html
          test -f _site/smart-search.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
