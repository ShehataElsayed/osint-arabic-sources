name: unpack
on:
  push:
    branches: [yemen-map]
permissions:
  contents: write
jobs:
  u:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          f=$(ls *.tgz 2>/dev/null | head -1)
          [ -n "$f" ] || exit 0
          tar xzf "$f"
          git rm -q -f -- .github/workflows/*unpack*.yml
          rm -f "$f" DELETE.txt
          git config user.name "Shehata El-sayed"
          git config user.email "noreply@users.noreply.github.com"
          git add -A
          git commit -m "Yemen page: compact layout, collapsible filters"
          git push
